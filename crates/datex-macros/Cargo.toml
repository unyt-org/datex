[package]
name = "datex_macros"
version = "0.1.9"
edition = "2024"
description = "The public macros for the DATEX Core Rust implementation"
authors = [
    "Benedikt Strehle <benedikt@unyt.org>",
    "Jonas Strehle <jonas@unyt.org>",
]
license-file = "../../LICENSE"

[lib]
proc-macro = true

[dependencies]
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
datex-macro-utils = { path = "../datex-macro-utils", version = "0.0.1" }
datex-core = { path = "../datex-core", version = "0.0.13", features = [
    "target_native",
    "compiler",
    "decompiler",
] }

[dev-dependencies]
tokio = { version = "1.43.0", features = [
    "sync",
    "macros",
    "io-util",
    "rt",
    "time",
], default-features = false }