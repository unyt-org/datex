[package]
name = "datex-code-generator"
version = "0.0.1"
description = "DATEX Code Generator trait and utilities"
authors = [
    "Benedikt Strehle <benedikt@unyt.org>",
    "Jonas Strehle <jonas@unyt.org>",
    "Norbert Brzezinski <norbert@unyt.org>",
]
edition = "2024"
license-file = "../../LICENSE"

[lib]
crate-type = ["rlib"]

[dependencies]
indexmap = { version = "2.9.0", default-features = false }
datex-core = { path = "../datex-core", version = "0.0.15", default-features = false, features = [
    "target_native",
    "decompiler",
    "disassembler",
    "syntax_highlighting_legacy",
    "compiler",
] }

quote = { version = "1", optional = true }
proc-macro2 = { version = "1", optional = true }
syn = { version = "2", features = ["full"], optional = true }
prettyplease = { version = "0.2", optional = true }


[features]
rust_codegen = ["dep:quote", "dep:proc-macro2", "dep:syn", "dep:prettyplease"]