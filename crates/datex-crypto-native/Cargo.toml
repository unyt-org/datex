[package]
name = "datex-crypto-native"
version = "0.0.3"
description = "Native implementation of the DATEX Crypto facade"
authors = [
    "Benedikt Strehle <benedikt@unyt.org>",
    "Jonas Strehle <jonas@unyt.org>",
    "Norbert Brzezinski <norbert@unyt.org>",
]
edition = "2024"
license-file = "../../LICENSE"

[lib]
crate-type = ["lib"]

[dependencies]
rand = { version = "0.10.2" }
datex-crypto-facade = { path = "../datex-crypto-facade", version = "0.0.3" }
uuid = { version = "1.15.1", features = ["v4"] }
openssl = { version = "0.10.73" }
# ml-kem = { version = "0.3.2", features = ["alloc", "getrandom", "zeroize"]}
# ml-dsa = { version = "0.1.1", features = ["alloc", "getrandom", "zeroize"]}

[dev-dependencies]
tokio = { version = "1.43.0", features = [
    "sync",
    "macros",
    "io-util",
    "rt",
    "time",
], default-features = false }
