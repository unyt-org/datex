[package]
name = "datex-facades"
version = "0.0.1"
description = "DATEX Facades for Traits used by the datex crate"
authors = [
    "Benedikt Strehle <benedikt@unyt.org>",
    "Jonas Strehle <jonas@unyt.org>",
    "Norbert Brzezinski <norbert@unyt.org>",
]
edition = "2024"
license-file = "../../LICENSE"

[lib]
