[package]
name = "datex-macro-utils"
version = "0.0.1"
description = "Common utils for datex macros"
authors = [
    "Benedikt Strehle <benedikt@unyt.org>",
    "Jonas Strehle <jonas@unyt.org>",
]
edition = "2024"
license-file = "../../LICENSE"

[lib]
crate-type = ["rlib"]

[dependencies]
quote = { version = "1.0" }
syn = { version = "2.0", features = ["full"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
datex-core = { path = "../datex-core", version = "0.0.13", features = [
    "target_native",
    "compiler",
] }
